repo_name: LUX_Data_Operations_Guide                       # <-- EDIT
repo_url: https://github.com/Tn-data/doc-insur-data-pipeline      # <-- EDIT
edit_uri: edit/main/docs/                                 # <-- EDIT (branch name)

copyright: Copyright &copy; LUX Actuaries &amp; Consultancy EG

nav:
